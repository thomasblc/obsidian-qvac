name: Release

# Build the plugin in CI and publish a GitHub release with the three plugin assets.
# Trigger: push a tag equal to the manifest version, e.g. `git tag -a 0.2.28 -m 0.2.28 && git push origin 0.2.28`.
#
# NO build-provenance attestation. Confirmed empirically across 0.2.22 and 0.2.27: Obsidian's review
# verifier rejects our attestation as "signature invalid / does not match this repository" and turns it
# into a BLOCKING Error, even though the assets have unique per-release digests (version-stamped since
# 0.2.24), exactly one attestation each, and `gh attestation verify` passes with exit 0. So the failure
# is on Obsidian's side, not ours, and we cannot fix it from here. A MISSING attestation is only a
# non-blocking "Recommendation", so we ship without one. Do NOT re-add attestation unless Obsidian's
# verifier is known to have changed.

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" \
            --notes "Automated release."
