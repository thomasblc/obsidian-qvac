name: Release

# Build the plugin in CI and publish a GitHub release with the three plugin assets.
# Trigger: push a tag equal to the manifest version, e.g. `git tag -a 0.2.27 -m 0.2.27 && git push origin 0.2.27`.
#
# Build-provenance attestation clears Obsidian's "Missing artifact attestations" recommendation.
# It was briefly removed (0.2.23) because Obsidian's verifier rejected valid attestations, but that was
# a digest-collision artifact: byte-identical assets across releases shared a digest, so a release
# inherited a prior build's attestation. Since 0.2.24 every asset is version-stamped (esbuild.config.mjs
# banners main.js AND styles.css), so each release has a UNIQUE digest with exactly one attestation and
# nothing stale to inherit. Attestation is re-enabled here.

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write # create the release
  id-token: write # mint the provenance signing token
  attestations: write # record the attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" \
            --notes "Automated release."
