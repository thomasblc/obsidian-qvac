name: Release

# Build the plugin in CI and publish a GitHub release with the three plugin assets.
# Trigger: push a tag equal to the manifest version, e.g. `git tag 0.2.23 && git push origin 0.2.23`.
#
# NOTE: build-provenance attestation was removed. It is only a "Recommendation" in Obsidian's review,
# and its verifier intermittently rejected valid attestations (a missing attestation is a non-blocking
# Recommendation, a failing one is a blocking Error). `gh attestation verify` confirmed our attestations
# were cryptographically valid, so this is an Obsidian-side flake, not a build issue. Can be re-added if
# that verifier stabilizes.

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" \
            --notes "Automated release."
